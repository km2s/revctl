[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revctl"
version = "0.1.0"
description = "Local AI code reviewer powered by Ollama — no data leaves your machine"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3"]

[project.scripts]
revctl = "cli_review.main:app"

[tool.hatch.build.targets.wheel]
packages = ["cli_review"]
